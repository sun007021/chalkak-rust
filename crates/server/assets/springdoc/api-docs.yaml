        pageSize:
          type: integer
          format: int32
        hasNext:
          type: boolean
        auditLogs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogResponse"
    AuditLogResponse:
      type: object
      properties:
        auditLogId:
          type: string
          format: uuid
        actorAdminId:
          type: string
          format: uuid
        actorUsername:
          type: string
        action:
          type: string
          enum:
          - POST_APPROVED
          - POST_REJECTED
          - POST_DELETED
          - USER_BANNED
          - USER_UNBANNED
          - TOPIC_CREATED
          - TOPIC_UPDATED
          - TOPIC_DELETED
        targetType:
          type: string
          enum:
          - POST
          - USER
          - TOPIC
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        beforeState:
          type: object
          additionalProperties: {}
          description: 작업별 허용 필드로 구성된 변경 전 상태. 민감정보는 포함하지 않습니다.
        afterState:
          type: object
          additionalProperties: {}
          description: 작업별 허용 필드로 구성된 변경 후 상태. 민감정보는 포함하지 않습니다.
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
    AdminTopicDeletionRequest:
      type: object
