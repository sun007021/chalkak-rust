      properties:
        reason:
          type: string
          description: 삭제 사유
          example: 주제 편성 변경
          maxLength: 500
          minLength: 0
      required:
      - reason
    AdminPostDeletionRequest:
      type: object
      properties:
        reason:
          type: string
          description: 관리자 게시물 삭제 사유. 입력 원문은 최대 500자이며 앞뒤 공백을 제거해 저장합니다.
          example: 운영 정책 위반
          maxLength: 500
          minLength: 1
      required:
      - reason
