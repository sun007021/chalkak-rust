openapi: 3.1.0
info:
  title: Chalkak API
  description: "Chalkak 사용자, 운영자 및 내부 API 문서"
  version: v1
servers:
- url: {{BASE_URL}}
  description: Generated server url
tags:
- name: Topics
  description: 주제 API
- name: Internal Post Image Processing
  description: 게시물 이미지 처리 내부 콜백 API
- name: Notifications
  description: 내 알림함 API
- name: Internal Signature Processing
  description: 사인 이미지 처리 내부 콜백 API
- name: Users
  description: 사용자 API
- name: Admin Users
  description: 관리자 사용자 조회 API
- name: Admin Audit Logs
  description: 읽기 전용 관리자 감사 로그 API
- name: Auth
  description: 인증 API
- name: Admin Topics
  description: 관리자 주제 생명주기 API
- name: Admin Auth
  description: 관리자 인증 API
- name: Post Likes
  description: 게시물 좋아요 API
- name: Admin Feedbacks
  description: 관리자 피드백 조회 API
- name: Feedbacks
  description: 사용자 피드백 API
- name: Admin Posts
  description: 관리자 게시물 검수 조회 API
- name: Posts
  description: 게시물 API
paths:
  /api/v1/users/me/signature:
    get:
      tags:
      - Users
      summary: 내 사인 조회
      operationId: getSignature
      responses:
        "200":
          description: 사인 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSignatureDetailResponse"
        "400":
          description: "사인 재등록 필요(SIGNATURE_REGISTRATION_REQUIRED): 사인 이미지 처리 실패 또\
            는 설정된 처리 제한 시간 초과"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
    put:
      tags:
      - Users
      summary: 사인 이미지 수정
      operationId: updateSignature
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignatureUpdateRequest"
        required: true
      responses:
        "200":
          description: 사인 이미지 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSignatureResponse"
        "400":
          description: 잘못된 이미지 업로드 정보 또는 이미지 재업로드 필요(SIGNATURE_REUPLOAD_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 이용이 정지된 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 업로드 이미지를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
  /api/v1/posts/{postId}:
    get:
      tags:
      - Posts
      summary: 게시물 상세 조회
      operationId: getPost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      responses:
        "200":
          description: 게시물 상세 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "400":
          description: 잘못된 게시물 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
    put:
      tags:
      - Posts
      summary: 게시물 제목 수정
      description: |
        본인이 작성한 PENDING 또는 APPROVED 게시물의 제목을 수정합니다.
        주제 참여 기간이 남아 있어야 하며, 기존 검수 상태와 제출 시각은 유지합니다.
        제목의 앞뒤 공백을 제거하고 null 또는 공백이면 제목을 삭제합니다.
      operationId: updatePost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateRequest"
        required: true
      responses:
        "200":
          description: 게시물 제목 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostUpdateResponse"
        "400":
          description: 잘못된 요청 또는 수정할 수 없는 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 본인의 게시물이 아니거나 이용이 정지된 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
    delete:
      tags:
      - Posts
      summary: 본인 게시물 삭제
      description: |
        본인이 작성한 PENDING 또는 APPROVED 게시물을 삭제합니다.
        게시물과 사진은 soft delete되고 연결된 좋아요는 삭제됩니다.
        이미 삭제한 게시물에 다시 요청해도 성공으로 처리합니다.
      operationId: deletePost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      responses:
        "204":
          description: 게시물 삭제 성공
        "400":
          description: 잘못된 게시물 ID 또는 삭제할 수 없는 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 본인이 작성한 게시물이 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
  /api/v1/posts/{postId}/likes:
    put:
      tags:
      - Post Likes
      summary: 게시물 좋아요 등록
      operationId: likePost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      responses:
        "200":
          description: 게시물 좋아요 등록 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostLikeResponse"
        "400":
          description: 잘못된 게시물 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 이용이 정지된 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
    delete:
      tags:
      - Post Likes
      summary: 게시물 좋아요 취소
      operationId: unlikePost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      responses:
        "200":
          description: 게시물 좋아요 취소 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostLikeResponse"
        "400":
          description: 잘못된 게시물 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 인증 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
  /api/v1/admin/topics/{topicId}:
    get:
      tags:
      - Admin Topics
      summary: 관리자 주제 상세 조회
      operationId: getTopic
      parameters:
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminTopicDetailResponse"
        "400":
          description: 잘못된 주제 ID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 API 접근 불가
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 주제를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Admin Topics
      summary: 관리자 주제 수정
      operationId: updateTopic
      parameters:
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicMutationRequest"
        required: true
      responses:
        "200":
          description: 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminTopicDetailResponse"
        "400":
          description: "잘못된 주제·상태, 날짜 중복 또는 참여 기간 겹침"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 API 접근 불가
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 주제를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Admin Topics
      summary: 관리자 주제 삭제
      operationId: deleteTopic
      parameters:
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicDeletionRequest"
        required: true
      responses:
        "204":
          description: 삭제 성공
        "400":
          description: 잘못된 상태 또는 삭제 사유
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 API 접근 불가
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 주제를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/posts/{postId}/moderation:
    put:
      tags:
      - Admin Posts
      summary: 관리자 게시물 승인·거절
      description: PENDING 게시물을 한 번만 승인하거나 사유와 함께 거절합니다.
      operationId: moderatePost
      parameters:
      - name: postId
        in: path
        description: 게시물 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPostModerationRequest"
        required: true
      responses:
        "200":
          description: 게시물 검수 확정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminPostModerationResponse"
        "400":
          description: 잘못된 요청 또는 현재 상태가 변경되어 검수할 수 없는 게시물
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 API 접근 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 게시물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/signature-processing/{uploadId}/upload-urls:
    post:
      tags:
      - Internal Signature Processing
      summary: 사인 이미지 처리 결과 업로드 URL 발급
      description: Lambda가 원본과 썸네일을 저장할 S3 presigned PUT URL을 발급합니다.
      operationId: issueUploadUrls
      parameters:
      - name: uploadId
        in: path
        description: 처리할 사인 이미지 업로드 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      - name: X-Chalkak-Callback-Timestamp
        in: header
        description: 요청 시각의 Unix epoch 초. 서버 시각과 5분 이내여야 합니다.
        required: true
        schema:
          type: string
        example: 1787562000
      - name: X-Chalkak-Callback-Signature
        in: header
        description: "timestamp, HTTP 메서드, 경로, 본문 해시를 서명한 v1 HMAC-SHA256 값"
        required: true
        schema:
          type: string
        example: v1=0123456789abcdef
      responses:
        "200":
          description: 업로드 URL 발급 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SignatureProcessingUploadUrlsResponse"
        "400":
          description: 비정규 업로드 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 콜백 서명
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/signature-processing/{uploadId}/failed:
    post:
      tags:
      - Internal Signature Processing
      summary: 사인 이미지 처리 실패 콜백
      description: Lambda의 사인 이미지 변환 실패 결과를 멱등하게 반영합니다.
      operationId: fail
      parameters:
      - name: uploadId
        in: path
        description: 처리할 사인 이미지 업로드 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      - name: X-Chalkak-Callback-Timestamp
        in: header
        description: 요청 시각의 Unix epoch 초. 서버 시각과 5분 이내여야 합니다.
        required: true
        schema:
          type: string
        example: 1787562000
      - name: X-Chalkak-Callback-Signature
        in: header
        description: "timestamp, HTTP 메서드, 경로, 본문 해시를 서명한 v1 HMAC-SHA256 값"
        required: true
        schema:
          type: string
        example: v1=0123456789abcdef
      responses:
        "204":
          description: 실패 결과 반영 성공
        "401":
          description: 유효하지 않은 콜백 서명
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/signature-processing/{uploadId}/complete:
    post:
      tags:
      - Internal Signature Processing
      summary: 사인 이미지 처리 완료 콜백
      description: Lambda의 사인 이미지 변환 완료 결과를 멱등하게 반영합니다.
      operationId: complete
      parameters:
      - name: uploadId
        in: path
        description: 처리할 사인 이미지 업로드 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      - name: X-Chalkak-Callback-Timestamp
        in: header
        description: 요청 시각의 Unix epoch 초. 서버 시각과 5분 이내여야 합니다.
        required: true
        schema:
          type: string
        example: 1787562000
      - name: X-Chalkak-Callback-Signature
        in: header
        description: "timestamp, HTTP 메서드, 경로, 본문 해시를 서명한 v1 HMAC-SHA256 값"
        required: true
        schema:
          type: string
        example: v1=0123456789abcdef
      responses:
        "204":
          description: 완료 결과 반영 성공
        "401":
          description: 유효하지 않은 콜백 서명
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/post-image-processing/{uploadId}/upload-urls:
    post:
      tags:
      - Internal Post Image Processing
      summary: 게시물 이미지 처리 결과 업로드 URL 발급
      description: Lambda가 원본과 썸네일을 저장할 S3 presigned PUT URL을 발급합니다.
      operationId: issueUploadUrls_1
      parameters:
      - name: uploadId
        in: path
        description: 처리할 게시물 이미지 업로드 ID
        required: true
        schema:
          type: string
          format: uuid
        example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      - name: X-Chalkak-Callback-Timestamp
        in: header
        description: 요청 시각의 Unix epoch 초. 서버 시각과 5분 이내여야 합니다.
        required: true
        schema:
          type: string
        example: 1787562000
      - name: X-Chalkak-Callback-Signature
        in: header
        description: "timestamp, HTTP 메서드, 경로, 본문 해시를 서명한 v1 HMAC-SHA256 값"
        required: true
        schema:
          type: string
        example: v1=0123456789abcdef
      responses:
        "200":
          description: 업로드 URL 발급 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostProcessingUploadUrlsResponse"
        "400":
          description: 비정규 업로드 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 유효하지 않은 콜백 서명
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/post-image-processing/{uploadId}/failed:
    post:
      tags:
      - Internal Post Image Processing
      summary: 게시물 이미지 처리 실패 콜백
      description: |
        Lambda의 게시물 이미지 변환 실패 결과를 멱등하게 반영합니다.
        업로드를 REJECTED로 내리고, 이미 만들어진 게시물이 있으면 이미지 처리 실패로 거절합니다.
      operationId: fail_1
      parameters:
      - name: uploadId
        in: path
        description: 처리한 게시물 이미지 업로드 ID
        required: true
        schema:
          type: string
          format: uuid
