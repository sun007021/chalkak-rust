              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 지금 참여할 수 있는 주제가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - accessToken: []
