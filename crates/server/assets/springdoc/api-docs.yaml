        "200":
          description: 감사 로그 목록 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminAuditLogListResponse"
        "400":
          description: "잘못된 필터, 기간 또는 페이지 조건"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 API 접근 불가
          content:
