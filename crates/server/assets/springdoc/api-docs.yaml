        message:
          type: string
    UserSignatureResponse:
      type: object
      properties:
        signatureOriginalImageUrl:
          type: string
    PostUpdateRequest:
      type: object
      properties:
        title:
          type:
          - string
          - "null"
          description: 수정할 제목. 앞뒤 공백을 제거하며 null 또는 공백이면 제목을 삭제합니다.
          example: 수정한 제목
      required:
      - title
    PostUpdateResponse:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        title:
          type:
          - string
          - "null"
    PostLikeResponse:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        likeCount:
          type: integer
          format: int64
        isLiked:
          type: boolean
    AdminTopicMutationRequest:
      type: object
      description: 관리자 주제 등록·수정 요청
      properties:
        title:
          type: string
          description: 주제 제목
          example: 오늘 가장 기억에 남은 순간
          maxLength: 255
          minLength: 0
        topicDate:
          type: string
          format: date
          description: 한국 기준 주제 날짜
          example: 2026-08-30
        startsAt:
          type: string
          format: date-time
          description: 참여 시작 시각
          example: 2026-08-29T15:00:00Z
        endsAt:
          type: string
          format: date-time
          description: 참여 종료 시각
          example: 2026-08-30T15:00:00Z
      required:
      - endsAt
      - startsAt
      - title
      - topicDate
    AdminTopicDetailResponse:
      type: object
      description: 관리자 주제 상세
      properties:
        topicId:
          type: string
          format: uuid
        title:
          type: string
        topicDate:
          type: string
          format: date
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        phase:
          type: string
          enum:
          - BEFORE_OPEN
          - OPEN
          - CLOSED
        postCounts:
          $ref: "#/components/schemas/AdminTopicPostCounts"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminTopicPostCounts:
      type: object
      description: 주제별 게시물 검수 상태 통계
      properties:
        pending:
          type: integer
          format: int64
        approved:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
    AdminPostModerationRequest:
      type: object
      properties:
        status:
          type: string
          description: 확정할 검수 상태
          enum:
          - APPROVED
          - REJECTED
          example: REJECTED
        rejectionReason:
          type:
          - string
          - "null"
          description: 거절 사유. REJECTED일 때 필수이며 최대 500자입니다.
          example: 운영 정책 위반
          maxLength: 500
      required:
      - status
    AdminPostModerationResponse:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        moderationStatus:
          type: string
          enum:
          - APPROVED
          - REJECTED
        moderatedBy:
          type: string
          format: uuid
        moderatedAt:
          type: string
          format: date-time
        rejectionReason:
          type:
          - string
          - "null"
    SignatureProcessingUploadUrlsResponse:
      type: object
      properties:
        originalUploadUrl:
          type: string
        thumbnailUploadUrl:
          type: string
        contentType:
          type: string
        cacheControl:
          type: string
    PostProcessingUploadUrlsResponse:
      type: object
      properties:
        originalUploadUrl:
          type: string
        thumbnailUploadUrl:
          type: string
        contentType:
          type: string
        cacheControl:
          type: string
    PostImageProcessingFailRequest:
      type: object
      properties:
        reason:
          type: string
          description: 거절 사유 코드
          enum:
          - UNSUPPORTED_FORMAT
          - CORRUPTED_IMAGE
          - ANIMATED_IMAGE
          - TOO_LARGE
          - TOO_MANY_PIXELS
          - MISSING_OBJECT
          - PROCESSING_ERROR
          example: UNSUPPORTED_FORMAT
          maxLength: 50
          minLength: 0
      required:
      - reason
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      required:
      - latitude
      - longitude
    PostImageProcessingCompleteRequest:
      type: object
      properties:
        width:
          type: integer
          format: int32
          description: 처리 후 원본 가로 픽셀
          example: 4032
          minimum: 0
        height:
          type: integer
          format: int32
          description: 처리 후 원본 세로 픽셀
          example: 3024
          minimum: 0
        byteSize:
          type: integer
          format: int64
          description: 처리 후 원본 바이트 크기
          example: 812345
          minimum: 0
        location:
          $ref: "#/components/schemas/Location"
          description: 촬영 위치. EXIF에 GPS가 없으면 null
        capturedAt:
          type: string
          description: "촬영 시각. EXIF에 없으면 null이고, offset이 없으면 offset 없이 전달된다"
          example: 2026-08-20T11:02:31+09:00
          maxLength: 64
          minLength: 0
        metaAttributes:
          type: object
          additionalProperties: {}
          description: 기종 등 나머지 EXIF 태그. 없으면 빈 객체
    UserSignatureUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    PostCreateRequest:
      type: object
      properties:
        topicId:
          type: string
          format: uuid
          description: 주제 ID
          example: 0198f6c1-62ba-7d30-8b12-0f733b6570b2
        photoUploadId:
          type: string
          format: uuid
          description: 사진 업로드 ID
          example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
        title:
          type:
          - string
          - "null"
          description: 작품 제목. 앞뒤 공백 제거 후 최대 10자입니다. 생략하거나 공백뿐이면 제목 없음으로 저장합니다.
          example: 오늘의 기록
      required:
      - photoUploadId
      - topicId
    PostCreateResponse:
      type: object
      properties:
        postId:
          type: string
          format: uuid
          description: 생성된 게시물 ID
          example: 0198f6c1-62ba-7d30-8b12-0f733b6570d5
        moderationStatus:
          type: string
          description: "이미지 처리 전 VALIDATING, 처리 완료 후 관리자 검수 대기이면 PENDING"
          enum:
          - VALIDATING
          - PENDING
          example: VALIDATING
    PostImageUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
          description: 게시물 생성 요청에 그대로 전달할 업로드 ID
          example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
        uploadUrl:
          type: string
          description: S3 presigned PUT URL
        expiresInSeconds:
          type: integer
          format: int64
          description: 발급 시점부터의 URL 유효 시간
          example: 300
        contentType:
          type: string
          description: PUT 요청에 그대로 사용해야 하는 Content-Type
          example: image/webp
        maxBytes:
          type: integer
          format: int64
          description: 허용 용량. 초과분은 업로드 후 이미지 처리 단계에서 거절된다
          example: 5242880
    FeedbackSubmissionRequest:
      type: object
      properties:
        content:
          type: string
          description: 피드백 내용. 앞뒤 공백을 제거한 후 최대 1000자이며 앞뒤 공백을 제거해 저장합니다.
          example: 사진 업로드 후 화면이 멈춰요.
          maxLength: 1000
          minLength: 1
      required:
      - content
    FeedbackSubmissionResponse:
      type: object
      properties:
        feedbackId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    SocialSignupRequest:
      type: object
      properties:
        signupToken:
          type: string
          description: 서명 업로드 URL 발급 응답에서 받은 5분 유효 회원가입 토큰
          minLength: 1
      required:
      - signupToken
    SocialSignupResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: 가입 직후 바로 사용할 수 있는 액세스 토큰
        expiresIn:
          type: integer
          format: int64
          description: 발급 시점부터의 액세스 토큰 유효 시간(초)
          example: 900
        refreshToken:
          type: string
          description: 액세스 토큰 재발급에 사용하는 리프레시 토큰
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: 발급 시점부터의 리프레시 토큰 유효 시간(초)
          example: 2592000
    SocialSignupSignatureUploadRequest:
      type: object
      properties:
