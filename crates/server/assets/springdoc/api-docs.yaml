  /api/v1/admin/audit-logs:
    get:
      tags:
      - Admin Audit Logs
      summary: 관리자 감사 로그 목록 조회
      description: |
        관리자·작업·대상·발생 시각으로 변경 이력을 조회합니다. 기간 양 끝값은 포함되고,
        같은 발생 시각은 로그 ID로 안정 정렬합니다. 대상과 로그 사이에 외래 키를 두지 않아
        삭제된 대상의 기록도 유지하며, 관리자 계정은 감사 로그가 있으면 삭제할 수 없습니다.
        변경 전후 JSON은 AdminAction별 허용 필드 규칙을 따르고 비밀번호·토큰·Webhook·FCM 값과
        이미지/스토리지 식별자를 저장하거나 응답하지 않습니다. 수정·삭제 API는 제공하지 않습니다.
      operationId: getAuditLogs
      parameters:
      - name: adminId
        in: query
        description: 처리 관리자 ID
        required: false
        schema:
          type: string
          format: uuid
          description: 처리 관리자 ID
      - name: action
        in: query
        description: 관리자 작업
        required: false
        schema:
          type: string
          description: 관리자 작업
          enum:
          - POST_APPROVED
          - POST_REJECTED
          - POST_DELETED
          - USER_BANNED
          - USER_UNBANNED
          - TOPIC_CREATED
          - TOPIC_UPDATED
          - TOPIC_DELETED
      - name: targetType
        in: query
        description: 작업 대상 유형
        required: false
        schema:
          type: string
          description: 작업 대상 유형
          enum:
          - POST
          - USER
          - TOPIC
      - name: targetId
        in: query
        description: 작업 대상 ID
        required: false
        schema:
          type: string
          format: uuid
          description: 작업 대상 ID
      - name: occurredFrom
        in: query
        description: 발생 시각 조회 시작값(포함)
        required: false
        schema:
          type: string
          format: date-time
          description: 발생 시각 조회 시작값(포함)
          example: 2026-08-01T00:00:00Z
        example: 2026-08-01T00:00:00Z
      - name: occurredTo
        in: query
        description: 발생 시각 조회 종료값(포함)
        required: false
        schema:
          type: string
          format: date-time
          description: 발생 시각 조회 종료값(포함)
          example: 2026-08-31T23:59:59Z
        example: 2026-08-31T23:59:59Z
      - name: sort
