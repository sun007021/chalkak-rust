components:
  schemas:
    UserSignatureUpdateRequest:
      type: object
      properties:
        signatureOriginalUploadId:
          type: string
          format: uuid
          description: 사인 원본 이미지 업로드 ID
          example: 0198f6c1-62ba-7d30-8b12-0f733b6570d4
      required:
      - signatureOriginalUploadId
    ErrorResponse:
      type: object
      properties:
        errorCode:
