[package]
name = "chalkak-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chalkak-core = { path = "../platform/core" }
chalkak-http = { path = "../platform/http" }
chalkak-db = { path = "../platform/db" }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bcrypt = { workspace = true }
chalkak-jwt = { path = "../platform/jwt" }
sha2 = { workspace = true }
# DB 값 변환: timestamptz -> jiff::Timestamp, date -> jiff::civil::Date, uuid -> uuid::Uuid.
postgres = { workspace = true, features = ["with-jiff-0_2", "with-uuid-1"] }
