# cargo-deny 설정. 의존성 정책(B안)의 "금지" 쪽을 기계적으로 막는다.
# 허용 목록 전체는 docs/plan/migration-plan.md 2장에 있다. 새 직접 의존성은 그 표를 먼저 갱신한다.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa 0.9의 Marvin 타이밍 부채널은 개인키 연산(복호화·서명)에만 해당한다. chalkak-jwt의 RS256 검증은 공개키만 쓰고,
    # 하네스 러너는 공개된 테스트 개인키로 ID Token을 로컬에서 서명할 때만 쓴다(네트워크에서 시간을 잴 수 없다).
    # FCM(PushWorker)은 Google 서비스 계정 개인키로 OAuth 요청용 JWT를 서명한다(RS256, 개인키 연산 1회/토큰 갱신). 이 서명은
    # 결정적 PKCS#1 v1.5이고 서명 값은 구글 토큰 서버로만 가며, 공격자가 서명 시간을 반복 측정할 입력을 줄 수 없다(서명할 내용을
    # 서버가 정한다). 그래도 서버가 개인키 연산을 쓰므로 위험을 인지하고 유지한다.
    # 패치된 버전이 없다(2026-09 기준). rsa 0.10이 안정화되면 올리고 이 항목을 지운다.
    { id = "RUSTSEC-2023-0071", reason = "jwt는 공개키 검증과 FCM OAuth용 서비스 계정 JWT 서명(서명 내용을 서버가 정함)만, 하네스는 테스트 키 로컬 서명만 사용한다" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
# 워크스페이스 crate는 배포하지 않는다(publish = false). 라이선스 검사 대상에서 뺀다.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 모든 crate가 publish = false라 워크스페이스 내부 path 의존성은 허용한다.
allow-wildcard-paths = true
deny = [
    # 웹 프레임워크
    { crate = "axum" }, { crate = "actix-web" }, { crate = "rocket" }, { crate = "warp" }, { crate = "poem" }, { crate = "tide" },
    { crate = "salvo" }, { crate = "tower-http" },
    # 고수준 HTTP 라이브러리 (C안에서만 허용)
    { crate = "hyper" }, { crate = "reqwest" }, { crate = "ureq" },
    # ORM·쿼리 매크로
    { crate = "diesel" }, { crate = "sea-orm" }, { crate = "sqlx" },
    # AWS SDK (SigV4·IMDSv2는 직접 구현)
    { crate = "aws-config" }, { crate = "aws-sdk-s3" }, { crate = "aws-smithy-runtime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
