[workspace]
resolver = "3"
members = [
    "crates/platform/http",
    "crates/platform/db",
    "crates/platform/core",
    "crates/platform/aws",
    "crates/platform/jwt",
    "crates/app",
    "crates/server",
    "harness/parity",
    "harness/fakes",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

# 의존성 허용 목록(docs/plan/migration-plan.md 2장, B안). 여기에 없는 crate는 deny.toml이 막는다.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.9"
postgres = "0.19"
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false }
rsa = { version = "0.9", default-features = false }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
signal-hook = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
