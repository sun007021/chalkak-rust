[workspace]
resolver = "3"
members = [
    "crates/platform/http",
    "crates/platform/db",
    "crates/platform/core",
    "crates/platform/aws",
    "crates/platform/jwt",
    "crates/app",
    "crates/server",
    "harness/parity",
    "harness/fakes",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

# 의존성 허용 목록(docs/plan/migration-plan.md 2장, B안). 여기에 없는 crate는 deny.toml이 막는다.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
postgres = "0.19"
hmac = "0.12"
sha2 = "0.10"
rsa = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
