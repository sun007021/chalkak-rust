[package]
name = "chalkak-parity"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Java(oracle)와 Rust(candidate)에 같은 시나리오를 보내 응답·DB 상태를 비교하는 차등 검증 러너"

[dependencies]
serde.workspace = true
# 골든 JSON의 키 순서를 빌드 방식(단독/워크스페이스)과 무관하게 같게 하려고 명시한다.
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
postgres.workspace = true
hmac.workspace = true
sha2 = { workspace = true, features = ["oid"] }
rsa = { workspace = true, features = ["std", "pem", "sha2"] }

[lints]
workspace = true
