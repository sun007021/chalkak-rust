name = "알림 수신 설정: 조회·부분 수정·본문 검증·인증"
tags = ["notification", "settings"]
clock = "2026-10-12T09:00:00+09:00"

# 근거: NotificationSettingsController, NotificationSettingsService, NotificationSettingsUpdateRequest,
# User#updatePushPreferences, NotificationSettingsControllerTest/AccessTest/ServiceTest.
# PATCH는 값이 하나도 없으면 400, 있는 값만 바꾸고 값이 그대로면 UPDATE하지 않는다(updated_at 유지).
# 인자 해석(@Valid @RequestBody) -> @RequiresExistingUser -> 서비스 순서라 본문 오류가 인증 오류보다 먼저다.

[setup]
sql = ["""
INSERT INTO users (id, email, signature_original_storage_key, topic_push_enabled, moderation_push_enabled, deleted_at) VALUES
  ('01990000-0000-7000-8000-000000000001', 'user1@test.chalkak', 'chalkak/signatures/user1/original.png', true, true, NULL),
  ('01990000-0000-7000-8000-000000000002', 'user2@test.chalkak', 'chalkak/signatures/user2/original.png', false, true, NULL),
  ('01990000-0000-7000-8000-000000000003', 'gone@test.chalkak', 'chalkak/signatures/user3/original.png', true, true, '2026-10-01T00:00:00+09:00'),
  ('01990000-0000-7000-8000-000000000004', 'banned@test.chalkak', 'chalkak/signatures/user4/original.png', true, false, NULL);
UPDATE users SET status = 'BANNED' WHERE id = '01990000-0000-7000-8000-000000000004'
"""]

[[step]]
name = "기본값 조회"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "저장된 값 그대로 조회"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000002" }

[[step]]
name = "정지 회원도 조회할 수 있다"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000004" }

[[step]]
name = "조회에 쿼리와 본문이 있어도 무시한다"
method = "GET"
path = "/api/v1/notification-settings?topicPushEnabled=false"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "탈퇴 회원 조회는 401"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000003" }

[[step]]
name = "없는 회원 조회는 401"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-0000000000ff" }

[[step]]
name = "토큰 없이 조회는 401"
method = "GET"
path = "/api/v1/notification-settings"

[[step]]
name = "관리자 토큰으로 조회는 403"
method = "GET"
path = "/api/v1/notification-settings"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }

[[step]]
name = "만료된 토큰으로 조회는 401"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001", expires_in = -60 }

[[step]]
name = "주제 푸시만 끈다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":false}'
advance_seconds = 60

[[step]]
name = "주제만 껐고 검수는 그대로"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "검수 푸시만 끈다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":false}'
advance_seconds = 60

[[step]]
name = "둘 다 꺼진 상태"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "null은 기존 값을 유지한다(같은 값이라 갱신 시각 유지)"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":null,"moderationPushEnabled":false}'
advance_seconds = 60

[[step]]
name = "한쪽만 null이고 다른 쪽을 켠다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":null,"moderationPushEnabled":true}'
advance_seconds = 60

[[step]]
name = "둘 다 보내 바꾼다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000002" }
body = '{"topicPushEnabled":true,"moderationPushEnabled":false}'
advance_seconds = 60

[[step]]
name = "알 수 없는 필드는 무시한다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000002" }
body = '{"topicPushEnabled":false,"extra":1}'
advance_seconds = 60

[[step]]
name = "정지 회원도 수정할 수 있다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000004" }
body = '{"moderationPushEnabled":true}'
advance_seconds = 60

[[step]]
name = "수정 결과 확인"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000002" }

[[step]]
name = "빈 객체는 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{}'

[[step]]
name = "두 값이 모두 null이면 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":null,"moderationPushEnabled":null}'

[[step]]
name = "필드 형식이 객체이면 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":{}}'

[[step]]
name = "필드 형식이 배열이면 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":[true]}'

[[step]]
name = "문자열 true는 불리언으로 읽는다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":"false"}'

[[step]]
name = "대소문자가 다른 문자열 TRUE"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":"TRUE"}'

[[step]]
name = "알 수 없는 문자열은 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":"yes"}'

[[step]]
name = "빈 문자열은 값이 없는 것으로 본다"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":""}'

[[step]]
name = "숫자 0은 거짓"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":0}'

[[step]]
name = "숫자 1은 참"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":1}'

[[step]]
name = "숫자 2"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":2}'

[[step]]
name = "소수는 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"moderationPushEnabled":1.5}'

[[step]]
name = "본문 없음은 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "깨진 JSON은 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"topicPushEnabled":'

[[step]]
name = "객체가 아닌 JSON은 400"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '[true]'

[[step]]
name = "JSON이 아닌 Content-Type은 415"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
headers = { "Content-Type" = "text/plain" }
body = '{"topicPushEnabled":false}'

[[step]]
name = "탈퇴 회원 수정은 401"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000003" }
body = '{"topicPushEnabled":false}'

[[step]]
name = "없는 회원 수정은 401"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-0000000000ff" }
body = '{"topicPushEnabled":false}'

[[step]]
name = "본문 오류가 인증 오류보다 먼저(탈퇴 회원 + 빈 본문)"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000003" }
body = '{}'

[[step]]
name = "토큰 없이 수정은 401"
method = "PATCH"
path = "/api/v1/notification-settings"
body = '{"topicPushEnabled":false}'

[[step]]
name = "관리자 토큰으로 수정은 403"
method = "PATCH"
path = "/api/v1/notification-settings"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
body = '{"topicPushEnabled":false}'

[[step]]
name = "허용하지 않은 메서드"
method = "DELETE"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "최종 확인"
method = "GET"
path = "/api/v1/notification-settings"
auth = { user = "01990000-0000-7000-8000-000000000001" }
