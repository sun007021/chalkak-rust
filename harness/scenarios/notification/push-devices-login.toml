name = "푸시 기기: 실제 로그인이 발급한 액세스 토큰(session_id 클레임)으로 등록·로그아웃·탈퇴"
tags = ["notification", "push-device", "auth", "oidc", "s3"]
clock = "2026-10-12T09:00:00+09:00"
db_opaque = ["token_hash"]

# 근거: AccessTokenIssuer#issueForSession, AuthenticatedUsers#findSessionId, PushDeviceService.
# 가입·로그인·재발급이 발급하는 액세스 토큰이 로그인(session_id)을 싣고, 기기 등록이 그 로그인에 붙는지 본다.

[[id_token]]
name = "g"
provider = "google"
sub = "google-sub-push"
nonce = "nonce-p"
email = "push@example.com"
email_verified = true

[[step]]
name = "업로드 URL 발급"
method = "POST"
path = "/api/v1/auth/social-signup/signature/uploads"
body = '{"provider":"GOOGLE","idToken":"${g}","rawNonce":"nonce-p"}'
capture = { uploadId = "uploadId", signupToken = "signupToken" }

[[step]]
name = "가입(첫 기기)"
method = "POST"
path = "/api/v1/auth/social-signup"
body = '{"signupToken":"${signupToken}"}'
opaque = ["accessToken", "refreshToken"]
capture = { at1 = "accessToken", r1 = "refreshToken" }
[step.fakes.s3."chalkak/signatures/local/original/${uploadId}.png"]
size = 2048
content_type = "image/png"
[step.fakes.s3."chalkak/signatures/local/thumbnail/${uploadId}.png"]
size = 512
content_type = "image/png"

[[step]]
name = "두 번째 기기 로그인"
method = "POST"
path = "/api/v1/auth/social-login"
body = '{"provider":"GOOGLE","idToken":"${g}","rawNonce":"nonce-p"}'
opaque = ["accessToken", "refreshToken"]
capture = { at2 = "accessToken", r2 = "refreshToken" }

[[step]]
name = "첫 기기 등록"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at1}" }
body = '{"fcmToken":"login-token-1"}'
advance_seconds = 30

[[step]]
name = "두 번째 기기 등록"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at2}" }
body = '{"fcmToken":"login-token-2"}'
advance_seconds = 30

[[step]]
name = "첫 기기의 토큰 갱신"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at1}" }
body = '{"fcmToken":"login-token-1b"}'

[[step]]
name = "첫 기기 재발급(같은 로그인)"
method = "POST"
path = "/api/v1/auth/refresh"
body = '{"refreshToken":"${r1}"}'
opaque = ["accessToken", "refreshToken"]
capture = { at1b = "accessToken", r1b = "refreshToken" }
advance_seconds = 30

[[step]]
name = "재발급된 액세스 토큰으로 두 번째 기기의 토큰을 가져온다"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at1b}" }
body = '{"fcmToken":"login-token-2"}'

[[step]]
name = "첫 기기 로그아웃"
method = "POST"
path = "/api/v1/auth/logout"
body = '{"refreshToken":"${r1b}"}'

[[step]]
name = "로그아웃한 로그인의 액세스 토큰은 아직 유효하지만 등록은 재로그인 필요"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at1b}" }
body = '{"fcmToken":"after-logout"}'

[[step]]
name = "알림 수신 설정은 액세스 토큰만으로 된다"
method = "GET"
path = "/api/v1/notification-settings"
auth = { raw = "Bearer ${at1b}" }

[[step]]
name = "탈퇴"
method = "DELETE"
path = "/api/v1/users/me"
auth = { raw = "Bearer ${at2}" }

[[step]]
name = "탈퇴 뒤 등록은 401"
method = "PUT"
path = "/api/v1/push-devices/current"
auth = { raw = "Bearer ${at2}" }
body = '{"fcmToken":"after-withdraw"}'
