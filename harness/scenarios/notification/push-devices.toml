name = "푸시 기기: 등록·갱신·토큰 이전·재로그인 필요·로그아웃·재사용 감지·탈퇴 정리"
tags = ["notification", "push-device", "auth"]
clock = "2026-10-12T09:00:00+09:00"
db_opaque = ["token_hash"]

# 근거: PushDeviceController, PushDeviceService, LoginSessionService, PushDevice, FcmToken,
# UserRefreshTokenService(revokeSession/revokeOwner -> 기기 삭제), PushDeviceServiceTest/AccessTest/LogoutTest/
# RefreshRevocationTest/WithdrawalTest.
# 기기는 로그인(session_id) 하나에 한 행이고 같은 FCM 토큰은 한 행에만 붙는다. 토큰이 다른 로그인으로 옮겨 가면 이전 행은 삭제된다.
# 리프레시 토큰은 SQL로 심는다(원문 push-rt-N, 저장값은 SHA-256 16진수). 액세스 토큰은 하네스가 session_id 클레임과 함께 발급한다.

