name = "요청 본문 오류: 잘못된 JSON, 빈 본문, 검증 실패, 잘못된 Content-Type"
tags = ["platform", "feedback"]

[setup]
sql = ["INSERT INTO users (id, email, signature_original_storage_key) VALUES ('01990000-0000-7000-8000-000000000001', 'user1@test.chalkak', 'chalkak/signatures/user1/original.png')"]

[[step]]
name = "깨진 JSON"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"content": '

[[step]]
name = "빈 본문"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = ''

[[step]]
name = "필수 필드 누락"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{}'

[[step]]
name = "공백 내용, 영어 Accept-Language"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
headers = { "Accept-Language" = "en-US" }
body = '{"content": "   "}'

[[step]]
name = "타입이 다른 필드"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"content": 123}'

[[step]]
name = "알 수 없는 필드는 무시"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
body = '{"content": "좋아요", "unknown": true}'

[[step]]
name = "text/plain Content-Type"
method = "POST"
path = "/api/v1/feedbacks"
auth = { user = "01990000-0000-7000-8000-000000000001" }
headers = { "Content-Type" = "text/plain" }
body = '{"content": "좋아요"}'
