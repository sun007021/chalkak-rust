tags = ["worker", "notification"]
lane = "worker"
clock = "2026-10-12T09:00:00+09:00"

# 근거: SqsPushService(poll/process), PushWorkerService, PushMessage, SqsPushServiceTest, PushWorkerServiceTest.
# 보내지 않는 경로는 모두 메시지를 지운다(ReceiveMessage 한 번 + DeleteMessage 한 번 = 가짜 SQS 기록 두 건). 단계마다 메시지 하나를 넣고 기록이 늘 때까지 기다린다.
# FCM 전송은 Java Admin SDK가 호스트를 바꾸지 못해(https://fcm.googleapis.com 고정) 이 lane에서 Java로 녹화할 수 없다. 전송 경로는 Rust 단위·DB 테스트가 맡는다.

