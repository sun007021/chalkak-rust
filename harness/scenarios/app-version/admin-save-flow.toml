[[step]]
name = "미설정 목록"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }

[[step]]
name = "ANDROID 최초 저장"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "2.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''
advance_seconds = 60

[[step]]
name = "공개 ANDROID 즉시 반영"
method = "GET"
path = "/api/v1/app-version?platform=ANDROID"

[[step]]
name = "공개 IOS는 그대로 미설정"
method = "GET"
path = "/api/v1/app-version?platform=IOS"

[[step]]
name = "저장 후 목록"
