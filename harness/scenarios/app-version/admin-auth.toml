[[step]]
name = "목록 익명"
method = "GET"
path = "/api/v1/admin/app-versions"

[[step]]
name = "목록 회원"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { user = "01990000-0000-7000-8000-000000000001" }

[[step]]
name = "목록 정지 회원"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { user = "01990000-0000-7000-8000-000000000002" }

[[step]]
name = "목록 없는 회원"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { user = "01990000-0000-7000-8000-0000000000ff" }

[[step]]
name = "목록 만료 관리자"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000a1", expires_in = -60 }

[[step]]
name = "목록 형식 오류 토큰"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { raw = "Bearer not-a-jwt" }

[[step]]
name = "목록 Bearer 아닌 스킴"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { raw = "Basic dXNlcjpwYXNz" }

[[step]]
name = "목록 없는 관리자"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000ff" }

[[step]]
name = "저장 익명"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "저장 회원"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { user = "01990000-0000-7000-8000-000000000001" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "저장 정지 회원"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { user = "01990000-0000-7000-8000-000000000002" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "저장 회원 잘못된 플랫폼은 권한이 먼저"
method = "PUT"
path = "/api/v1/admin/app-versions/WEB"
auth = { user = "01990000-0000-7000-8000-000000000001" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "저장 익명 잘못된 본문"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
headers = { "Content-Type" = "application/json" }
body = '''깨진'''

[[step]]
name = "저장 형식 오류 토큰"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { raw = "Bearer not-a-jwt" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "저장 없는 관리자는 감사 로그 외래 키 때문에 서버 오류"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { admin = "01990000-0000-7000-8000-0000000000ff" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "권한 거절 뒤에도 미설정"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }

[[step]]
name = "관리자 저장"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.0.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

