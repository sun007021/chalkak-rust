name = "관리자 앱 버전: 직접 입력한 기존 설정의 첫 수정"
tags = ["app-version", "app-version-admin"]
clock = "2026-10-29T10:00:00+09:00"

[setup]
sql = ["""
INSERT INTO admins (id, username, password, created_at, updated_at) VALUES
  ('01990000-0000-7000-8000-0000000000a1', 'operator', '$2y$12$GbP5jGCW/tL2TyqY9POOG.gHRFksjWnUfK/OtpzXE.U5.tyR1.MX6', '2026-09-01T00:00:00Z', '2026-09-01T00:00:00Z'),
  ('01990000-0000-7000-8000-0000000000a2', 'reviewer', '$2y$12$GbP5jGCW/tL2TyqY9POOG.gHRFksjWnUfK/OtpzXE.U5.tyR1.MX6', '2026-09-02T00:00:00Z', '2026-09-02T00:00:00Z');
INSERT INTO app_versions (id, platform, minimum_supported_version, store_url, created_at, updated_at) VALUES
  ('01990000-0000-7000-8000-0000000a0001', 'ANDROID', '1.2.0', 'https://play.google.com/store/apps/details?id=com.example.chalkak', '2026-10-28T01:00:00Z', '2026-10-28T01:00:00Z'),
  ('01990000-0000-7000-8000-0000000a0002', 'IOS', '1.2.0', 'https://apps.apple.com/app/id999', '2026-10-28T02:00:00Z', '2026-10-28T03:00:00Z');
"""]

[[step]]
name = "기존 설정 목록"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }

[[step]]
name = "기존 설정 revision null은 충돌"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.3.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "출시 확인"}'''

[[step]]
name = "기존 설정 같은 값은 변경 없음"
method = "PUT"
path = "/api/v1/admin/app-versions/IOS"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": null, "minimumSupportedVersion": "1.2.0", "storeUrl": "https://apps.apple.com/app/id999", "reason": "출시 확인"}'''

[[step]]
name = "기존 설정 첫 수정"
method = "PUT"
path = "/api/v1/admin/app-versions/ANDROID"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": 0, "minimumSupportedVersion": "1.3.0", "storeUrl": "https://play.google.com/store/apps/details?id=com.example.chalkak", "reason": "첫 관리자 수정"}'''
advance_seconds = 120

[[step]]
name = "기존 IOS 첫 수정"
method = "PUT"
path = "/api/v1/admin/app-versions/IOS"
auth = { admin = "01990000-0000-7000-8000-0000000000a2" }
headers = { "Content-Type" = "application/json" }
body = '''{"revision": 0, "minimumSupportedVersion": "1.4.0", "storeUrl": "https://apps.apple.com/app/id999", "reason": "IOS 정리"}'''
advance_seconds = 120

[[step]]
name = "수정 후 목록"
method = "GET"
path = "/api/v1/admin/app-versions"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }

[[step]]
name = "감사 로그"
method = "GET"
path = "/api/v1/admin/audit-logs?targetType=APP_VERSION&sort=occurredAtAsc"
auth = { admin = "01990000-0000-7000-8000-0000000000a1" }
